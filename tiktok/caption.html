<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caption TikTok</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caption TikTok">
<meta name="theme-color" content="#2B1706">
<style>
  :root{--bg:#FFF6E0;--card:#fff;--ink:#1B0F03;--sub:#7A2E0A;--btn:#2B1706;--btnt:#FCE0A0}
  @media (prefers-color-scheme:dark){:root{--bg:#1a120a;--card:#2a1d10;--ink:#fbe9c6;--sub:#f3b76b;--btn:#FCE0A0;--btnt:#2B1706}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
  main{max-width:640px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--sub);font-size:14px;margin-bottom:12px}
  button{width:100%;padding:20px;font-size:20px;font-weight:800;border:0;border-radius:16px;background:var(--btn);color:var(--btnt);margin-bottom:10px}
  button.alt{background:transparent;color:var(--ink);border:2px solid var(--btn);font-size:17px;padding:14px}
  .steps{font-size:15px;line-height:1.6;background:var(--card);border-radius:12px;padding:10px 14px;margin:6px 0 12px}
  pre{white-space:pre-wrap;word-wrap:break-word;background:var(--card);padding:14px;border-radius:12px;font:15px/1.5 system-ui,sans-serif}
  .ok{background:#1f7a3a!important;color:#fff!important}
</style></head>
<body><main>
  <h1>Caption TikTok</h1>
  <div class="sub" id="day">Đang tải…</div>
  <button id="go" disabled>📋 COPY &amp; MỞ TIKTOK</button>
  <button id="copy" class="alt" disabled>Chỉ copy</button>
  <div class="steps">1️⃣ Bấm nút trên → caption đã được copy, TikTok tự mở.<br>2️⃣ Vào <b>Hộp thư</b> → bấm thông báo bản nháp → <b>Tiếp</b>.<br>3️⃣ Giữ ngón tay ở ô mô tả → <b>Dán</b> → <b>Đăng</b>.</div>
  <pre id="cap"></pre>
</main>
<script>
const API='https://api.github.com/repos/aqtienanh-bot/lich-van-nien-media/contents/lich-van-nien/xuat-ban';
const BASE='https://aqtienanh-bot.github.io/lich-van-nien-media/lich-van-nien/xuat-ban/';
async function latestDay(){
  try{const j=await (await fetch(API+'?ref=main',{cache:'no-store'})).json(); if(Array.isArray(j)) return j.map(x=>x.name).filter(n=>/^\d{4}-\d{2}-\d{2}$/.test(n)).sort().pop();}catch(e){}
  const d=Date.now()+7*3600e3; for(const k of [1,0]){const x=new Date(d+k*864e5).toISOString().slice(0,10); if((await fetch(BASE+x+'/tiktok/caption.txt',{cache:'no-store'})).ok) return x;}
}
async function copyText(t,el){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
  const ok=document.execCommand('copy');ta.remove();return ok;
}
(async()=>{
  const day=await latestDay(), pre=document.getElementById('cap'), go=document.getElementById('go'), cp=document.getElementById('copy');
  if(!day){document.getElementById('day').textContent='Chưa có caption.';return;}
  const r=await fetch(BASE+day+'/tiktok/caption.txt?t='+Date.now(),{cache:'no-store'}); const txt=r.ok?(await r.text()).trim():'';
  const [y,m,d]=day.split('-'); document.getElementById('day').textContent='Bài ngày '+(+d)+'/'+(+m)+'/'+y+(txt?'':' — chưa có caption');
  pre.textContent=txt; go.disabled=cp.disabled=!txt;
  cp.onclick=async()=>{ if(await copyText(txt)){cp.textContent='✅ Đã copy';cp.classList.add('ok');} };
  go.onclick=async()=>{
    await copyText(txt); go.textContent='✅ ĐÃ COPY — đang mở TikTok…'; go.classList.add('ok');
    const android=/Android/i.test(navigator.userAgent);
    setTimeout(()=>{ location.href = android
      ? 'intent://#Intent;scheme=snssdk1233;package=com.zhiliaoapp.musically;S.browser_fallback_url=https%3A%2F%2Fwww.tiktok.com%2F;end'
      : 'snssdk1233://'; },400);
  };
})();
</script>
</body></html>
